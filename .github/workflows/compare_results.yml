name: Compare result submissions

on:
  pull_request:
    paths:
      - "results/**/*.json"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run compare-results --output result-comparison.md
      - uses: actions/upload-artifact@v6
        with:
          name: decision-bench-result-comparison
          path: result-comparison.md

name: Publish leaderboard data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Publish generated dataset
        env:
          HF_OIDC_RESOURCE: datasets/Hanno-Labs/decision-bench-results
        run: |
          uv run build-leaderboard --output-dir dist
          uv run hf upload \
            Hanno-Labs/decision-bench-results \
            dist \
            . \
            --repo-type dataset \
            --commit-message "Publish ${GITHUB_SHA::7}"

  space:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Publish leaderboard snapshot
        env:
          HF_OIDC_RESOURCE: spaces/Hanno-Labs/decision-bench-leaderboard
        run: |
          uv run build-leaderboard --output-dir dist
          uv run hf upload \
            Hanno-Labs/decision-bench-leaderboard \
            dist/leaderboard.parquet \
            leaderboard.parquet \
            --repo-type space \
            --commit-message "Publish ${GITHUB_SHA::7}"
          uv run hf upload \
            Hanno-Labs/decision-bench-leaderboard \
            dist/leaderboard.json \
            static/leaderboard.json \
            --repo-type space \
            --commit-message "Publish ${GITHUB_SHA::7}"

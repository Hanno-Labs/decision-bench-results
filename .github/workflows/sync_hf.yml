name: Publish leaderboard data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Publish generated dataset
        run: |
          uv run build-leaderboard --output-dir dist
          uv run hf download \
            Hanno-Labs/decision-bench \
            data/eval-00000-of-00001.parquet \
            --repo-type dataset \
            --revision 071b7b2d2e1504c89e1e5a811a3f82e1bfe3aedb \
            --local-dir "${RUNNER_TEMP}/decisionbench-input"
          uv run python scripts/prepare_inspect_dataset.py \
            "${RUNNER_TEMP}/decisionbench-input/data/eval-00000-of-00001.parquet" \
            dist/data/decisionbench.parquet \
            --manifest dist/input_manifest.json
          HF_OIDC_RESOURCE=datasets/Hanno-Labs/decision-bench-results uv run hf upload \
            Hanno-Labs/decision-bench-results \
            dist \
            . \
            --repo-type dataset \
            --commit-message "Publish ${GITHUB_SHA::7}"

  space:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Publish leaderboard snapshot
        env:
          HF_OIDC_RESOURCE: spaces/Hanno-Labs/decision-bench-leaderboard
        run: |
          uv run build-leaderboard --output-dir dist
          uv run hf upload \
            Hanno-Labs/decision-bench-leaderboard \
            dist/leaderboard.parquet \
            leaderboard.parquet \
            --repo-type space \
            --commit-message "Publish ${GITHUB_SHA::7}"
          uv run hf upload \
            Hanno-Labs/decision-bench-leaderboard \
            dist/leaderboard.json \
            static/leaderboard.json \
            --repo-type space \
            --commit-message "Publish ${GITHUB_SHA::7}"

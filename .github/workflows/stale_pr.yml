name: Label and close stale pull requests

on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9.1.0
        with:
          stale-pr-label: stale
          days-before-pr-stale: 14
          days-before-pr-close: 7
